<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="Sandro Ferreira - Profissional de TI">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F7FAFD">
        <animate attributeName="stop-color" values="#F7FAFD;#EDF3FB;#F7FAFD" dur="14s" repeatCount="indefinite"/>
      </stop>
      <stop offset="55%" stop-color="#E8F1FB">
        <animate attributeName="stop-color" values="#E8F1FB;#DCE9F8;#E8F1FB" dur="14s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#CFE3F8">
        <animate attributeName="stop-color" values="#CFE3F8;#B9D6F5;#CFE3F8" dur="14s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="edgeFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="14%" stop-color="#FFFFFF"/>
      <stop offset="86%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="400"/></clipPath>
    <mask id="fade"><rect width="1200" height="400" fill="url(#edgeFade)"/></mask>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="400" fill="url(#bg)"/>

    <rect x="0" y="0" width="1200" height="6" fill="#0F6CBD">
      <animate attributeName="fill" values="#0F6CBD;#4FC3F7;#0F6CBD" dur="6s" repeatCount="indefinite"/>
    </rect>

    <circle cx="1085" cy="60" r="190" fill="#0F6CBD" opacity="0.10">
      <animate attributeName="cy" values="50;150;50" dur="16s" repeatCount="indefinite"/>
      <animate attributeName="r" values="190;220;190" dur="16s" repeatCount="indefinite"/>
    </circle>

    <circle cx="110" cy="370" r="150" fill="#4FC3F7" opacity="0.14">
      <animate attributeName="cy" values="380;300;380" dur="20s" repeatCount="indefinite"/>
      <animate attributeName="r" values="150;175;150" dur="20s" repeatCount="indefinite"/>
    </circle>

    <g transform="skewX(-18)">
      <rect x="-400" y="-120" width="240" height="640" fill="url(#shine)">
        <animate attributeName="x" values="-400;1500" dur="8s" repeatCount="indefinite"/>
      </rect>
    </g>

    <text x="600" y="150" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="#0B1220">Sandro Ferreira</text>

    <rect x="500" y="181" width="200" height="3" rx="1.5" fill="#0F6CBD">
      <animate attributeName="width" values="60;220;60" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="x" values="570;490;570" dur="9s" repeatCount="indefinite"/>
    </rect>

    <rect x="0" y="212" width="1200" height="58" fill="#0B1220" opacity="0.05"/>
    <rect x="0" y="212" width="1200" height="1" fill="#0F6CBD" opacity="0.30"/>
    <rect x="0" y="269" width="1200" height="1" fill="#0F6CBD" opacity="0.30"/>

    <g mask="url(#fade)">
      <g>
        <animateTransform attributeName="transform" type="translate" from="0 0" to="-1600 0" dur="22s" repeatCount="indefinite"/>
        <text x="800" y="248" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="19" fill="#1E3A5F">Profissional de TI &#8226; ITSM &#8226; Infraestrutura &#8226; Monitoramento &#8226; Ciberseguran&#231;a &#8226; Automa&#231;&#227;o &#8226; Redes &#8226;</text>
        <text x="2400" y="248" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="19" fill="#1E3A5F">Profissional de TI &#8226; ITSM &#8226; Infraestrutura &#8226; Monitoramento &#8226; Ciberseguran&#231;a &#8226; Automa&#231;&#227;o &#8226; Redes &#8226;</text>
      </g>
    </g>

    <text x="600" y="360" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="19" letter-spacing="4" fill="#3B6EA5">BRASIL &#8226; ITIL &#8226; COBIT</text>
  </g>
</svg>
